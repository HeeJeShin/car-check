name: car-check
# 로컬 개발용 PostgreSQL. `pnpm db:up`으로 실행합니다.
# 호스트 포트 5434: booth-agent(5433)나 맥에 깔린 Postgres(5432)와 겹치지 않게.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: car
      POSTGRES_DB: car_check
    ports:
      - "5434:5432"
    # `docker compose up --wait`가 DB가 접속을 받을 때까지 기다리게 합니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car -d car_check"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - car-check-db:/var/lib/postgresql/data
volumes:
  car-check-db:
